<body><div id="startup-status" role="status" aria-live="polite"><section><h1>שומרי המילים</h1><p id="startup-message">פותחים את הספרייה…</p><p id="startup-help">הטעינה הראשונה עשויה לקחת כמה רגעים.</p><button id="startup-retry" type="button" hidden>ניסיון נוסף</button><noscript><p>כדי לשחק צריך להפעיל JavaScript בהגדרות הדפדפן.</p></noscript></section></div><div id="app"></div>
<script>
// This ES5 guard runs even if the module fails to download or cannot be parsed.
(function () {
 var panel=document.getElementById('startup-status'),message=document.getElementById('startup-message'),help=document.getElementById('startup-help'),retry=document.getElementById('startup-retry'),done=false,timer;
 var english=document.documentElement.lang==='en';
 if(english){panel.querySelector('h1').textContent='Wordkeepers';message.textContent='Opening the library…';help.textContent='The first visit may take a few moments.';retry.textContent='Try again';}
 function failed(){
  if(done)return;
  clearTimeout(timer);
  message.textContent=english?'The game could not start.':'המשחק לא הצליח להיפתח.';
  help.textContent=english?'Check your connection and try again. On an older iPhone or iPad, update the system and open the link in Safari. Compatibility is intended for Safari 14 and newer.':'בדקו את החיבור ונסו שוב. באייפון או באייפד ישן, נסו לעדכן את המערכת ולפתוח את הקישור ב־Safari. התאימות מיועדת ל־Safari 14 ומעלה.';
  retry.hidden=false;
 }
 function onError(event){if(event.target===window||event.target.tagName==='SCRIPT')failed();}
 retry.onclick=function(){window.location.reload();};
 window.addEventListener('error',onError,true);
 window.addEventListener('unhandledrejection',failed);
 timer=setTimeout(failed,25000);
 window.wordkeepersBoot={fail:failed,ready:function(){
  done=true;clearTimeout(timer);panel.hidden=true;
  window.removeEventListener('error',onError,true);window.removeEventListener('unhandledrejection',failed);
 }};
}());
</script><script type="module" src="./runtime/game.js?v=ea4cf5e683b8"></script></body>
